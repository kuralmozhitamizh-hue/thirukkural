<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>உலகப் பொதுமறை - திருக்குறள்</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <h1>உலகப் பொதுமறை</h1>
        <div class="search-container">
            <input type="number" id="searchInput" placeholder="குறள் எண்ணைத் தேடுக (1-1330)" min="1" max="1330">
            <button onclick="searchKural()"><i class="fas fa-search"></i></button>
        </div>
    </header>

    <main id="kural-container">
        <!-- 1. அதிகாரம் மற்றும் பால் விவரங்கள் -->
        <section class="card">
            <h2><i class="fas fa-book-open"></i> அமைப்பு விவரங்கள்</h2>
            <div class="details-grid" id="hierarchyDetails">
                <!-- Data will be injected here -->
            </div>
        </section>

        <!-- 2. குறள் மற்றும் மொழிபெயர்ப்பு (Carousel) -->
        <section class="card">
            <h2><i class="fas fa-feather-alt"></i> குறள்</h2>
            <div class="carousel" id="kuralCarousel">
                <!-- Data will be injected here -->
            </div>
        </section>

        <!-- 3. உரைகள் (Carousel) -->
        <section class="card">
            <h2><i class="fas fa-comment-dots"></i> உரைகள்</h2>
            <div class="carousel" id="explanationCarousel">
                <!-- Data will be injected here -->
            </div>
        </section>

        <!-- 4. வார்த்தைக்கான அர்த்தங்கள் (Carousel) -->
        <section class="card">
            <h2><i class="fas fa-spell-check"></i> பொருள் விளக்கம்</h2>
            <div class="carousel" id="wordMeaningCarousel">
                <!-- Data will be injected here -->
            </div>
        </section>

        <!-- 5. இலக்கணம் (Carousel) -->
        <section class="card">
            <h2><i class="fas fa-language"></i> இலக்கணம்</h2>
            <div class="carousel" id="grammarCarousel">
                <!-- Data will be injected here -->
            </div>
        </section>

        <!-- 6. கதைகள் (Carousel) -->
        <section class="card">
            <h2><i class="fas fa-book-reader"></i> குறள் கதை</h2>
            <div class="carousel" id="storyCarousel">
                <!-- Data will be injected here -->
            </div>
        </section>
    </main>

    <!-- Floating Navigation Buttons -->
    <div class="floating-nav">
        <button id="prevBtn" onclick="navigateKural(-1)"><i class="fas fa-chevron-left"></i> முந்தைய குறள்</button>
        <span id="currentKuralDisplay">1 / 1330</span>
        <button id="nextBtn" onclick="navigateKural(1)">அடுத்த குறள் <i class="fas fa-chevron-right"></i></button>
    </div>

    <script src="script.js"></script>
</body>
</html>
