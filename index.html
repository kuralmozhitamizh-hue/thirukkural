<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>உலகப் பொதுமறை - திருக்குறள்</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@300;400;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-dark: #6d28d9;
            --accent: #f59e0b;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-light: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Mukta Malar', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(245, 158, 11, 0.1) 0%, transparent 40%);
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-size: 1.2rem;
            font-weight: 800;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
        }

        h1.site-title {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(90deg, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-box {
            position: relative;
            width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 42px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            outline: none;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
        }

        .container {
            max-width: 850px;
            margin: 1.5rem auto 6rem;
            padding: 0 1rem;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.6rem;
        }

        .card-header i { color: var(--accent); font-size: 1.2rem; }
        .card-header h3 { font-size: 1.1rem; font-weight: 700; color: #f1f5f9; }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 1rem;
        }

        .meta-box {
            background: rgba(255, 255, 255, 0.03);
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .meta-label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 4px; }
        .meta-value { font-size: 1.05rem; font-weight: 700; color: var(--text-light); }
        .meta-sub { font-size: 0.8rem; color: var(--primary); margin-top: 2px; }

        .kural-main-box {
            text-align: center;
            padding: 2rem 1rem;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.12), rgba(245, 158, 11, 0.05));
            border-radius: 16px;
            border: 1px solid rgba(139, 92, 246, 0.25);
            position: relative;
        }

        .kural-badge {
            position: absolute;
            top: 12px;
            right: 16px;
            background: var(--primary-dark);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .kural-tamil-text {
            font-size: 1.4rem;
            font-weight: 700;
            line-height: 1.6;
            color: #ffffff;
            margin-bottom: 1rem;
        }

        .kural-transliteration { font-size: 0.95rem; color: var(--text-dim); font-style: italic; margin-bottom: 0.8rem; }
        .kural-translation { font-size: 1rem; color: var(--accent); font-weight: 600; }

        .carousel-wrapper { position: relative; overflow: hidden; border-radius: 12px; }
        .carousel-track { display: flex; transition: transform 0.4s ease-in-out; }
        .carousel-slide { min-width: 100%; padding: 1.2rem; background: rgba(255, 255, 255, 0.02); border-radius: 12px; }

        .carousel-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--border-color);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: grid;
            place-items: center;
        }
        .carousel-nav-btn.prev { left: 5px; }
        .carousel-nav-btn.next { right: 5px; }

        .carousel-dots { display: flex; justify-content: center; gap: 6px; margin-top: 0.8rem; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, 0.2); cursor: pointer; }
        .dot.active { background: var(--primary); width: 18px; border-radius: 10px; }

        .floating-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 99;
            width: 90%;
            max-width: 450px;
        }

        .float-btn {
            flex: 1;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            color: white;
            padding: 12px 18px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(109, 40, 217, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .loading-status {
            text-align: center;
            padding: 1rem;
            color: var(--accent);
            font-weight: bold;
        }

        @media (max-width: 600px) {
            header { flex-direction: column; gap: 0.8rem; }
            .search-box { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-icon">கு</div>
            <h1 class="site-title">உலகப் பொதுமறை</h1>
        </div>
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="number" id="kuralSearchInput" placeholder="குறள் எண்..." min="1" max="1330" onchange="jumpToKural(this.value)">
        </div>
    </header>

    <main class="container">
        <!-- 1. Structure Details -->
        <section class="card">
            <div class="card-header"><i class="fa-solid fa-sitemap"></i><h3>அமைப்பு விவரங்கள்</h3></div>
            <div class="meta-grid" id="metaDetails"><div class="loading-status">தரவுகள் ஏற்றப்படுகிறது...</div></div>
        </section>

        <!-- 2. Primary Kural Card -->
        <section class="card">
            <div class="kural-main-box">
                <div class="kural-badge" id="kuralNumberBadge">குறள் #1</div>
                <div class="kural-tamil-text" id="kuralTamilText">ஏற்றுகிறது...</div>
                <div class="kural-transliteration" id="kuralTransliteration">Loading...</div>
                <div class="kural-translation" id="kuralTranslation">Loading...</div>
            </div>
        </section>

        <!-- 3. Explanations -->
        <section class="card">
            <div class="card-header"><i class="fa-solid fa-book-open"></i><h3>உரை விளக்கங்கள்</h3></div>
            <div class="carousel-wrapper" id="explanationsCarousel">
                <button class="carousel-nav-btn prev" onclick="moveCarousel('explanationsCarousel', -1)"><i class="fa-solid fa-chevron-left"></i></button>
                <div class="carousel-track" id="explanationsTrack"></div>
                <button class="carousel-nav-btn next" onclick="moveCarousel('explanationsCarousel', 1)"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div class="carousel-dots" id="explanationsDots"></div>
        </section>

        <!-- 4. Word Meanings Carousel -->
        <section class="card">
            <div class="card-header"><i class="fa-solid fa-spell-check"></i><h3>சொல்லொருள்</h3></div>
            <div class="carousel-wrapper" id="wordsCarousel">
                <button class="carousel-nav-btn prev" onclick="moveCarousel('wordsCarousel', -1)"><i class="fa-solid fa-chevron-left"></i></button>
                <div class="carousel-track" id="wordsTrack"></div>
                <button class="carousel-nav-btn next" onclick="moveCarousel('wordsCarousel', 1)"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div class="carousel-dots" id="wordsDots"></div>
        </section>

        <!-- 5. Grammar Breakdown -->
        <section class="card">
            <div class="card-header"><i class="fa-solid fa-graduation-cap"></i><h3>இலக்கணம்</h3></div>
            <div class="carousel-wrapper" id="grammarCarousel">
                <button class="carousel-nav-btn prev" onclick="moveCarousel('grammarCarousel', -1)"><i class="fa-solid fa-chevron-left"></i></button>
                <div class="carousel-track" id="grammarTrack"></div>
                <button class="carousel-nav-btn next" onclick="moveCarousel('grammarCarousel', 1)"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div class="carousel-dots" id="grammarDots"></div>
        </section>

        <!-- 6. Moral Story Carousel -->
        <section class="card">
            <div class="card-header"><i class="fa-solid fa-masks-theater"></i><h3>நீதிக் கதை</h3></div>
            <div class="carousel-wrapper" id="storyCarousel">
                <button class="carousel-nav-btn prev" onclick="moveCarousel('storyCarousel', -1)"><i class="fa-solid fa-chevron-left"></i></button>
                <div class="carousel-track" id="storyTrack"></div>
                <button class="carousel-nav-btn next" onclick="moveCarousel('storyCarousel', 1)"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div class="carousel-dots" id="storyDots"></div>
        </section>
    </main>

    <div class="floating-nav">
        <button class="float-btn" onclick="navigateKural(-1)"><i class="fa-solid fa-arrow-left"></i> முந்தையது</button>
        <button class="float-btn" onclick="navigateKural(1)">அடுத்தது <i class="fa-solid fa-arrow-right"></i></button>
    </div>

    <!-- DIRECT GITHUB RAW FETCH ENGINE -->
    <script>
        // -------------------------------------------------------------
        // கீழே உள்ள Username & Repo Name-ஐ உன்னுடைய GitHub விவரங்களுக்கு மாற்று செல்லம்!
        // -------------------------------------------------------------
        const GITHUB_USERNAME = "kuralmozhitamizh-hue"; 
        const GITHUB_REPO = "thirukkural";
        const BRANCH = "main"; // அல்லது master

        const RAW_BASE_URL = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/${BRANCH}`;

        let currentKuralNum = 1;
        const db = {};
        const carouselIndices = {};

        async function fetchGitHubJSON(fileName) {
            try {
                const response = await fetch(`${RAW_BASE_URL}/${fileName}`);
                if (!response.ok) return null;
                return await response.json();
            } catch (err) {
                console.warn(`Error fetching ${fileName} from GitHub Raw:`, err);
                return null;
            }
        }

        async function initApp() {
            // Load from GitHub Raw directly
            db.detail = await fetchGitHubJSON('detail.json');
            db.thirukkural = await fetchGitHubJSON('thirukkural.json');
            db.grammar = await fetchGitHubJSON('thirukkural_full_grammar.json');
            db.words = await fetchGitHubJSON('thirukkural_word_meanings.json');
            db.stories = await fetchGitHubJSON('thirukkural_data.json');

            renderKural(currentKuralNum);
        }

        function findKuralData(dataset, num) {
            if (!dataset) return null;
            if (Array.isArray(dataset)) {
                return dataset.find(item => item && (item.Number == num || item.number == num || item.kural_number == num || item.id == num));
            }
            if (typeof dataset === 'object') {
                if (dataset.kural && Array.isArray(dataset.kural)) {
                    return dataset.kural.find(k => k.Number == num || k.number == num);
                }
                return dataset[num] || dataset[num.toString()] || null;
            }
            return null;
        }

        function renderKural(num) {
            currentKuralNum = num;
            document.getElementById('kuralSearchInput').value = num;

            renderStructure(num);
            renderMainKural(num);
            renderExplanations(num);
            renderWordMeanings(num);
            renderGrammar(num);
            renderStory(num);
        }

        function renderStructure(num) {
            const container = document.getElementById('metaDetails');
            let section = "அறத்துப்பால்", secTrans = "Virtue";
            let group = "பாயிரவியல்", grpTrans = "Prologue";
            let chapter = "கடவுள் வாழ்த்து", chapTrans = "The Praise of God", chapNum = 1, kuralPos = num;

            try {
                if (db.detail) {
                    let rootList = Array.isArray(db.detail) ? db.detail : [db.detail];
                    let root = rootList[0];
                    if (root && root.section && root.section.detail) {
                        for (let s of root.section.detail) {
                            if (s.chapterGroup && s.chapterGroup.detail) {
                                for (let g of s.chapterGroup.detail) {
                                    if (g.chapters && g.chapters.detail) {
                                        for (let c of g.chapters.detail) {
                                            if (num >= c.start && num <= c.end) {
                                                section = s.name || section; secTrans = s.translation || secTrans;
                                                group = g.name || group; grpTrans = g.translation || grpTrans;
                                                chapter = c.name || chapter; chapTrans = c.translation || chapTrans;
                                                chapNum = c.number || chapNum; kuralPos = num - c.start + 1;
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            } catch(e) {}

            container.innerHTML = `
                <div class="meta-box"><div class="meta-label">பால்</div><div class="meta-value">${section}</div><div class="meta-sub">${secTrans}</div></div>
                <div class="meta-box"><div class="meta-label">இயல்</div><div class="meta-value">${group}</div><div class="meta-sub">${grpTrans}</div></div>
                <div class="meta-box"><div class="meta-label">அதிகாரம் #${chapNum}</div><div class="meta-value">${chapter}</div><div class="meta-sub">${chapTrans}</div></div>
                <div class="meta-box"><div class="meta-label">குறள் நிலை</div><div class="meta-value">குறள் ${kuralPos} / 10</div><div class="meta-sub">மொத்த எண்: ${num}</div></div>
            `;
        }

        function renderMainKural(num) {
            const itemT = findKuralData(db.thirukkural, num) || {};
            const itemS = findKuralData(db.stories, num) || {};
            const itemG = findKuralData(db.grammar, num) || {};

            const line1 = itemT.Line1 || itemT.line1 || itemS.line1 || itemS.kural_line1 || itemG.line1 || "அகர முதல எழுத்தெல்லாம் ஆதி";
            const line2 = itemT.Line2 || itemT.line2 || itemS.line2 || itemS.kural_line2 || itemG.line2 || "பகவன் முதற்றே உலகு.";
            
            const transliteration = itemT.transliteration || itemS.transliteration || itemT.Translation || "Agara Mudhala Ezhuththellaam Aadhi Bhagavan Mudhattre Ulagu";
            const translation = itemT.Translation || itemT.translation || itemS.meaning_english || itemG.explanation_en || "As the letter 'A' is the first of all letters, so the eternal God is the primary source of the world.";

            document.getElementById('kuralNumberBadge').innerText = `குறள் #${num}`;
            document.getElementById('kuralTamilText').innerHTML = `${line1}<br>${line2}`;
            document.getElementById('kuralTransliteration').innerText = transliteration;
            document.getElementById('kuralTranslation').innerText = translation;
        }

        function renderExplanations(num) {
            const itemG = findKuralData(db.grammar, num) || {};
            const itemS = findKuralData(db.stories, num) || {};
            const itemT = findKuralData(db.thirukkural, num) || {};

            const slides = [
                { title: "மு. வரதராசனார் உரை", content: itemG.mv || itemT.mv || itemS.meaning_tamil || "விளக்கம் கிடைக்கவில்லை." },
                { title: "சாலமன் பாப்பையா உரை", content: itemG.sp || itemT.sp || itemS.meaning_tamil || "விளக்கம் கிடைக்கவில்லை." },
                { title: "மணக்குடவர் உரை", content: itemG.mk || itemT.mk || itemS.meaning_tamil || "விளக்கம் கிடைக்கவில்லை." },
                { title: "English Meaning", content: itemG.explanation_en || itemT.Translation || itemS.meaning_english || "Explanation not available." }
            ];

            renderCarouselTrack('explanationsTrack', slides.map(s => `
                <div class="carousel-slide">
                    <h4 style="color: var(--accent); margin-bottom: 6px;">${s.title}</h4>
                    <p style="line-height: 1.5; font-size: 1rem;">${s.content}</p>
                </div>
            `));
            initCarousel('explanationsCarousel', slides.length);
        }

        function renderWordMeanings(num) {
            const item = findKuralData
