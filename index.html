<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>உலகப் பொதுமறை - திருக்குறள்</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@300;400;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-dark: #6d28d9;
            --accent: #f59e0b;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-light: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Mukta Malar', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(245, 158, 11, 0.1) 0%, transparent 40%);
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-size: 1.2rem;
            font-weight: 800;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
        }

        h1.site-title {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(90deg, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-box {
            position: relative;
            width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 42px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            outline: none;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
        }

        .container {
            max-width: 850px;
            margin: 1.5rem auto 6rem;
            padding: 0 1rem;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.6rem;
        }

        .card-header i { color: var(--accent); font-size: 1.2rem; }
        .card-header h3 { font-size: 1.1rem; font-weight: 700; color: #f1f5f9; }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 1rem;
        }

        .meta-box {
            background: rgba(255, 255, 255, 0.03);
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .meta-label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 4px; }
        .meta-value { font-size: 1.05rem; font-weight: 700; color: var(--text-light); }
        .meta-sub { font-size: 0.8rem; color: var(--primary); margin-top: 2px; }

        .kural-main-box {
            text-align: center;
            padding: 2rem 1rem;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.12), rgba(245, 158, 11, 0.05));
            border-radius: 16px;
            border: 1px solid rgba(139, 92, 246, 0.25);
            position: relative;
        }

        .kural-badge {
            position: absolute;
            top: 12px;
            right: 16px;
            background: var(--primary-dark);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .kural-tamil-text {
            font-size: 1.4rem;
            font-weight: 700;
            line-height: 1.6;
            color: #ffffff;
            margin-bottom: 1rem;
        }

        .kural-transliteration { font-size: 0.95rem; color: var(--text-dim); font-style: italic; margin-bottom: 0.8rem; }
        .kural-translation { font-size: 1rem; color: var(--accent); font-weight: 600; }

        .carousel-wrapper { position: relative; overflow: hidden; border-radius: 12px; }
        .carousel-track { display: flex; transition: transform 0.4s ease-in-out; }
        .carousel-slide { min-width: 100%; padding: 1.2rem; background: rgba(255, 255, 255, 0.02); border-radius: 12px; }

        .carousel-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--border-color);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: grid;
            place-items: center;
        }
        .carousel-nav-btn.prev { left: 5px; }
        .carousel-nav-btn.next { right: 5px; }

        .carousel-dots { display: flex; justify-content: center; gap: 6px; margin-top: 0.8rem; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, 0.2); cursor: pointer; }
        .dot.active { background: var(--primary); width: 18px; border-radius: 10px; }

        .floating-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 99;
            width: 90%;
            max-width: 450px;
        }

        .float-btn {
            flex: 1;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            color: white;
            padding: 12px 18px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(109, 40, 217, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        @media (max-width: 600px) {
            header { flex-direction: column; gap: 0.8rem; }
            .search-box { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-icon">கு</div>
            <h1 class="site-title">உலகப் பொதுமறை</h1>
        </div>
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="number" id="kuralSearchInput" placeholder="குறள் எண்..." min="1" max="1330" onchange="jumpToKural(this.value)">
        </div>
    </header>

    <main class="container">
        <!-- 1. Structure Details -->
        <section class="card">
            <div class="card-header"><i class="fa-solid fa-sitemap"></i><h3>அமைப்பு விவரங்கள்</h3></div>
            <div class="meta-grid" id="metaDetails"></div>
        </section>

        <!-- 2. Primary Kural Card -->
        <section class="card">
            <div class="kural-main-box">
                <div class="kural-badge" id="kuralNumberBadge">குறள் #1</div>
                <div class="kural-tamil-text" id="kuralTamilText"></div>
                <div class="kural-transliteration" id="kuralTransliteration"></div>
                <div class="kural-translation" id="kuralTranslation"></div>
            </div>
        </section>

        <!-- 3. Explanations -->
        <section class="card">
            <div class="card-header"><i class="fa-solid fa-book-open"></i><h3>உரை விளக்கங்கள்</h3></div>
            <div class="carousel-wrapper" id="explanationsCarousel">
                <button class="carousel-nav-btn prev" onclick="moveCarousel('explanationsCarousel', -1)"><i class="fa-solid fa-chevron-left"></i></button>
                <div class="carousel-track" id="explanationsTrack"></div>
                <button class="carousel-nav-btn next" onclick="moveCarousel('explanationsCarousel', 1)"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div class="carousel-dots" id="explanationsDots"></div>
        </section>

        <!-- 4. Word Meanings Carousel -->
        <section class="card">
            <div class="card-header"><i class="fa-solid fa-spell-check"></i><h3>சொல்லொருள்</h3></div>
            <div class="carousel-wrapper" id="wordsCarousel">
                <button class="carousel-nav-btn prev" onclick="moveCarousel('wordsCarousel', -1)"><i class="fa-solid fa-chevron-left"></i></button>
                <div class="carousel-track" id="wordsTrack"></div>
                <button class="carousel-nav-btn next" onclick="moveCarousel('wordsCarousel', 1)"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div class="carousel-dots" id="wordsDots"></div>
        </section>

        <!-- 5. Grammar Breakdown -->
        <section class="card">
            <div class="card-header"><i class="fa-solid fa-graduation-cap"></i><h3>இலக்கணம்</h3></div>
            <div class="carousel-wrapper" id="grammarCarousel">
                <button class="carousel-nav-btn prev" onclick="moveCarousel('grammarCarousel', -1)"><i class="fa-solid fa-chevron-left"></i></button>
                <div class="carousel-track" id="grammarTrack"></div>
                <button class="carousel-nav-btn next" onclick="moveCarousel('grammarCarousel', 1)"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div class="carousel-dots" id="grammarDots"></div>
        </section>

        <!-- 6. Moral Story Carousel -->
        <section class="card">
            <div class="card-header"><i class="fa-solid fa-masks-theater"></i><h3>நீதிக் கதை</h3></div>
            <div class="carousel-wrapper" id="storyCarousel">
                <button class="carousel-nav-btn prev" onclick="moveCarousel('storyCarousel', -1)"><i class="fa-solid fa-chevron-left"></i></button>
                <div class="carousel-track" id="storyTrack"></div>
                <button class="carousel-nav-btn next" onclick="moveCarousel('storyCarousel', 1)"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div class="carousel-dots" id="storyDots"></div>
        </section>
    </main>

    <div class="floating-nav">
        <button class="float-btn" onclick="navigateKural(-1)"><i class="fa-solid fa-arrow-left"></i> முந்தையது</button>
        <button class="float-btn" onclick="navigateKural(1)">அடுத்தது <i class="fa-solid fa-arrow-right"></i></button>
    </div>

    <!-- PURE STANDALONE JAVASCRIPT (ZERO FETCH - FAST & RELIABLE) -->
    <script>
        let currentKuralNum = 1;
        const carouselIndices = {};

        // Localized Sample DB Structure (Expandable or dynamic)
        const sampleKuralData = {
            1: {
                section: "அறத்துப்பால்", secTrans: "Virtue",
                group: "பாயிரவியல்", grpTrans: "Prologue",
                chapter: "கடவுள் வாழ்த்து", chapTrans: "The Praise of God", chapNum: 1,
                line1: "அகர முதல எழுத்தெல்லாம் ஆதி",
                line2: "பகவன் முதற்றே உலகு.",
                translit: "Agara Mudhala Ezhuththellaam Aadhi Bhagavan Mudhattre Ulagu",
                transl: "As the letter 'A' is the first of all letters, so the eternal God is the primary source of the world.",
                mv: "எழுத்துக்கள் எல்லாம் அகரத்தை அடிப்படையாகக் கொண்டுள்ளன; அதுபோல உலகம் முதற்கடவுளை அடிப்படையாகக் கொண்டுள்ளது.",
                sp: "எழுத்துக்கள் எல்லாம் அகரத்தில் தொடங்குகின்றன; உலகம் ஆதிபகவனில் தொடங்குகிறது.",
                mk: "எழுத்துக்களுக்கெல்லாம் அகரம் முதலாவது; அதுபோல உலகத்திற்கு ஆதிபகவன் முதலாவனான்.",
                words: [
                    { word: "அகர", meaning: "அ என்னும் எழுத்து", english: "Letter 'A'" },
                    { word: "முதல", meaning: "முதலாவதாக உடையவை", english: "First in order" },
                    { word: "எழுத்தெல்லாம்", meaning: "எழுத்துக்கள் எல்லாம்", english: "All letters" },
                    { word: "ஆதி பகவன்", meaning: "முதற் கடவுள்", english: "Supreme God" },
                    { word: "முதற்றே", meaning: "முதலாவதாகக் கொண்டது", english: "Primary origin" },
                    { word: "உலகு", meaning: "உலகம்", english: "The world" }
                ],
                grammar: [
                    { title: "எழுத்து இலக்கணம்", content: "அகர - உயிரெழுத்து / முதல் எழுத்து" },
                    { title: "சொல் இலக்கணம்", content: "பெயர்ச்சொல் மற்றும் வினைச்சொல் அமைப்புகள்" },
                    { title: "யாப்பு இலக்கணம்", content: "குறள் வெண்பா (ஈரடி, 7 சீர்கள்)" },
                    { title: "அணி இலக்கணம்", content: "எடுத்துக்காட்டு உவமையணி" }
                ],
                story: {
                    tamil: "ஒரு ஊரில் அறிஞர் ஒருவர் வாழ்ந்து வந்தார். அவர் எதையும் தொடங்குவதற்கு முன் முதன்மையானதை உணர்வது அவசியம் என்றார். அகரம் இல்லாமல் வார்த்தைகள் இல்லை, அதுபோல் இறை நம்பிக்கை இல்லாமல் வாழ்வு நிறைவடைவதில்லை என்பதை விளக்கும் கதை.",
                    english: "A teacher explains to his pupils that just as no word can exist without the prime letter 'A', no creation exists without its creator."
                }
            }
        };

        function renderKural(num) {
            currentKuralNum = num;
            document.getElementById('kuralSearchInput').value = num;

            // Get Data or Fallback
            const data = sampleKuralData[num] || {
                section: "அறத்துப்பால்", secTrans: "Virtue",
                group: "இயல்", grpTrans: "Group",
                chapter: "அதிகாரம்", chapTrans: "Chapter", chapNum: Math.ceil(num/10),
                line1: `குறள் எண் ${num} வரிகள் லோடு ஆகிறது...`,
                line2: "உலகப் பொதுமறை திருக்குறள்",
                translit: `Kural Number ${num}`,
                transl: `Kural number ${num} translation and explanation.`,
                mv: `குறள் ${num} மு.வ உரை விளக்கம்.`,
                sp: `குறள் ${num} சாலமன் பாப்பையா உரை.`,
                mk: `குறள் ${num} மணக்குடவர் உரை.`,
                words: [{ word: "குறள்", meaning: "ஈரடி வெண்பா", english: "Two line verse" }],
                grammar: [{ title: "யாப்பு இலக்கணம்", content: "குறள் வெண்பா" }],
                story: { tamil: `குறள் ${num} தொடர்பான சிறுகதை...`, english: `Moral story for Kural ${num}` }
            };

            // Render Structure
            document.getElementById('metaDetails').innerHTML = `
                <div class="meta-box"><div class="meta-label">பால்</div><div class="meta-value">${data.section}</div><div class="meta-sub">${data.secTrans}</div></div>
                <div class="meta-box"><div class="meta-label">இயல்</div><div class="meta-value">${data.group}</div><div class="meta-sub">${data.grpTrans}</div></div>
                <div class="meta-box"><div class="meta-label">அதிகாரம் #${data.chapNum}</div><div class="meta-value">${data.chapter}</div><div class="meta-sub">${data.chapTrans}</div></div>
                <div class="meta-box"><div class="meta-label">குறள் எண்</div><div class="meta-value">குறள் ${num}</div><div class="meta-sub">1330 இல் ${num}</div></div>
            `;

            // Render Main
            document.getElementById('kuralNumberBadge').innerText = `குறள் #${num}`;
            document.getElementById('kuralTamilText').innerHTML = `${data.line1}<br>${data.line2}`;
            document.getElementById('kuralTransliteration').innerText = data.translit;
            document.getElementById('kuralTranslation').innerText = data.transl;

            // Render Explanations Carousel
            const expSlides = [
                { title: "மு. வரதராசனார் உரை", content: data.mv },
                { title: "சாலமன் பாப்பையா உரை", content: data.sp },
                { title: "மணக்குடவர் உரை", content: data.mk },
                { title: "English Meaning", content: data.transl }
            ];
            renderCarouselTrack('explanationsTrack', expSlides.map(s => `
                <div class="carousel-slide">
                    <h4 style="color: var(--accent); margin-bottom: 6px;">${s.title}</h4>
                    <p style="line-height: 1.5; font-size: 1rem;">${s.content}</p>
                </div>
            `));
            initCarousel('explanationsCarousel', expSlides.length);

            // Render Words Carousel
            renderCarouselTrack('wordsTrack', data.words.map(w => `
                <div class="carousel-slide" style="text-align: center;">
                    <h4 style="font-size: 1.2rem; color: var(--primary); margin-bottom: 6px;">${w.word}</h4>
                    <p style="font-size: 1rem;"><strong>தமிழ் பொருள்:</strong> ${w.meaning}</p>
                    <p style="color: var(--text-dim); font-size: 0.9rem;"><strong>English:</strong> ${w.english}</p>
                </div>
            `));
            initCarousel('wordsCarousel', data.words.length);

            // Render Grammar Carousel
            renderCarouselTrack('grammarTrack', data.grammar.map(g => `
                <div class="carousel-slide">
                    <h4 style="color: var(--accent); margin-bottom: 6px;">${g.title}</h4>
                    <p style="font-size: 0.95rem;">${g.content}</p>
                </div>
            `));
            initCarousel('grammarCarousel', data.grammar.length);

            // Render Story Carousel
            const storySlides = [
                { title: "தமிழ் சிறுகதை", content: data.story.tamil },
                { title: "English Moral Story", content: data.story.english }
            ];
            renderCarouselTrack('storyTrack', storySlides.map(s => `
                <div class="carousel-slide">
                    <h4 style="color: var(--primary); margin-bottom: 6px;">${s.title}</h4>
                    <p style="line-height: 1.5; font-size: 0.95rem;">${s.content}</p>
                </div>
            `));
            initCarousel('storyCarousel', storySlides.length);
        }

        function renderCarouselTrack(id, htmlArray) {
            document.getElementById(id).innerHTML = htmlArray.join('');
        }

        function initCarousel(id, count) {
            carouselIndices[id] = 0;
            updateCarousel(id, count);
        }

        function moveCarousel(id, dir) {
            const track = document.getElementById(id).querySelector('.carousel-track');
            const count = track.children.length;
            if (count <= 1) return;
            carouselIndices
